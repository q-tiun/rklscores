<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RKL Live Scores</title>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<style>
:root {
  --bg-color: #121212;
  --card-color: #1e1e1e;
  --accent-color: #00ff88;
  --text-color: #ffffff;
  --text-muted: #aaa;
  --warn-color: #ffb347;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', Roboto, sans-serif;
  background-color: var(--bg-color);
  color: var(--text-color);
  min-height: 100vh;
  padding: 24px;
  max-width: 760px;
  margin: auto;
}
h1 { text-align: center; font-size: 32px; margin-bottom: 16px; }
.loading { text-align: center; font-size: 14px; color: var(--accent-color); margin-bottom: 16px; }
.loading.error { color: #ff6b6b; }
.notice { text-align: center; font-size: 13px; color: var(--warn-color); margin-bottom: 16px; }
.home-link { display: block; text-align: center; margin-top: 30px; font-size: 14px; color: var(--accent-color); text-decoration: none; transition: opacity 0.2s; }
.home-link:hover { opacity: 0.7; }
.game-container { background-color: var(--card-color); border-radius: 16px; margin-bottom: 24px; box-shadow: 0 0 12px rgba(0, 255, 136, 0.15); overflow: hidden; }
.game-header { padding: 16px 20px; background-color: #2a2a2a; cursor: pointer; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 17px; transition: background 0.2s ease; }
.game-header:hover { background-color: #353535; }
.game-body { display: none; padding: 20px; }
.team-roster { margin-bottom: 24px; }
.roster-title { font-weight: bold; margin-bottom: 8px; color: var(--text-muted); }
.player-row { padding: 6px 12px; background-color: #333; border-radius: 6px; margin-bottom: 6px; font-size: 14px; }
.player-row.missing { color: var(--text-muted); }
</style>
</head>
<body>

<h1>RKL Live Scores</h1>
<div class="loading" id="loading-indicator">Loading...</div>
<div class="notice" id="notice" style="display:none"></div>
<div id="games-container"></div>

<a href="index.html" class="home-link">← Home</a>

<script>
// === CONFIGURATION ===
const scheduleCsvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSLoCV49CaRygsWb5Z8eMudI9MTtipvqBoMYTfWUyz26k-oUF6R331QTzvTynP8zc94_4BvaVkYt7Kh/pub?output=csv';
const rosterCsvUrl   = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQYhnOOhIqxpnGxpC24R4lUF_-K5E_OJ_JvXDFJSmEMEI3j52pSJFSdiJtbeJEhspP-52j0bG0mxLwa/pub?output=csv';

// === HELPERS ===
function getTodayString() {
  const now = new Date();
  const est = new Date(now.toLocaleString('en-US', { timeZone: 'America/New_York' }));
  if (est.getHours() < 7) est.setDate(est.getDate() - 1);
  return `${est.getMonth() + 1}/${est.getDate()}`;
}

function parseCSV(text) {
  const clean = s => s.replace(/^\uFEFF/, '').replace(/^"|"$/g, '').trim();
  const lines = text.trim().split(/\r?\n/);
  const headers = lines[0].split(',').map(clean);
  return lines.slice(1).map(line => {
    const values = line.split(',').map(clean);
    const obj = {};
    headers.forEach((h, i) => obj[h] = values[i]);
    return obj;
  });
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

// Finds any column with "karma" in its name, any capitalization
function findKarmaKey(row) {
  return Object.keys(row).find(k => k.toLowerCase().includes('karma'));
}

// Returns the player's karma from the sheet, or null if empty / not a number
function readKarma(p) {
  const key = findKarmaKey(p);
  const raw = key ? p[key] : undefined;
  if (raw === undefined || raw === '') return null;
  const n = parseFloat(raw);
  return Number.isNaN(n) ? null : n;
}

function processTeam(players) {
  let teamTotal = 0;
  let missingCount = 0;

  const rows = players.map(p => {
    const userAt = esc(p['User @']?.trim() || 'Unknown');
    const role = (p['role'] || '').toLowerCase();
    const deduction = parseFloat(p['deductions'] || 0) || 0;

    const base = readKarma(p);
    if (base === null) {
      missingCount++;
      return `<div class="player-row missing">${userAt}: no score yet</div>`;
    }

    const adjusted = base - deduction;
    const boosted = role === 'captain' ? adjusted * 1.5 : adjusted;
    teamTotal += boosted;

    const label = role === 'captain'
      ? `${userAt} (c): ${Math.round(adjusted)} → ${Math.round(boosted)}`
      : `${userAt}: ${Math.round(adjusted)}`;
    return `<div class="player-row">${label}</div>`;
  });

  return { rows, total: Math.round(teamTotal), missingCount };
}

function createGameHTML(team1, team2, t1Total, t2Total, t1Rows, t2Rows, index) {
  const id = `game-${index}`;
  return `
<div class="game-container">
  <div class="game-header" onclick="
    const body = document.getElementById('${id}');
    body.style.display = body.style.display === 'block' ? 'none' : 'block';
  ">
    ${esc(team1)} (${t1Total}) vs ${esc(team2)} (${t2Total})
  </div>
  <div class="game-body" id="${id}">
    <div class="team-roster">
      <div class="roster-title">${esc(team1)}</div>
      ${t1Rows.join('')}
    </div>
    <div class="team-roster">
      <div class="roster-title">${esc(team2)}</div>
      ${t2Rows.join('')}
    </div>
  </div>
</div>`;
}

async function loadGames() {
  const loading = document.getElementById('loading-indicator');
  const notice = document.getElementById('notice');
  const container = document.getElementById('games-container');

  try {
    const [scheduleRes, rosterRes] = await Promise.all([
      axios.get(scheduleCsvUrl),
      axios.get(rosterCsvUrl)
    ]);

    const rosterRows = parseCSV(rosterRes.data);

    // Fail loudly, and show the real column names, if no karma column is found
    if (rosterRows.length && !findKarmaKey(rosterRows[0])) {
      loading.textContent = `No column with "karma" in its name. Columns found: ${Object.keys(rosterRows[0]).join(', ')}`;
      loading.classList.add('error');
      return;
    }

    const today = getTodayString();
    const games = parseCSV(scheduleRes.data).filter(g => g.Date?.trim() === today);
    const players = rosterRows.filter(p => p['playing?']?.toLowerCase() === 'yes');

    if (games.length === 0) {
      loading.textContent = `No games found for ${today}.`;
      return;
    }

    let html = '';
    let totalMissing = 0;

    games.forEach((game, i) => {
      const t1 = game['Team 1'];
      const t2 = game['Team 2'];
      const t1Data = processTeam(players.filter(p => p.Team === t1));
      const t2Data = processTeam(players.filter(p => p.Team === t2));
      totalMissing += t1Data.missingCount + t2Data.missingCount;
      html += createGameHTML(t1, t2, t1Data.total, t2Data.total, t1Data.rows, t2Data.rows, i);
    });

    container.innerHTML = html;
    loading.textContent = 'Done.';

    if (totalMissing > 0) {
      notice.style.display = 'block';
      notice.textContent = `${totalMissing} player(s) have no score entered yet.`;
    }
  } catch (e) {
    loading.textContent = 'Failed to load game data. Check that the Google Sheets are published as CSV.';
    loading.classList.add('error');
    console.error(e);
  }
}

loadGames();
</script>
</body>
</html>
